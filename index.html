<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>esse4 &#183; report dei test</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="app.ico" sizes="any" />
  <link rel="stylesheet" href="app.css" />
  <script>
    // Ingresso di un sito con più asset (qareport landing): la barra dei report, senza asset scelto.
    // Ogni report ricorda nel browser l'ultimo asset aperto (qa:asset, la sua etichetta): se c'è, ci si va
    // subito; ?scegli mostra comunque questa pagina.
    var ASSETS = [{"label":"Backend","url":"backend/"},{"label":"Web App","url":"ui/"}];
    // Link scritti quando nella radice c'era il report del primo asset (un'esecuzione o un test nell'indirizzo,
    // o piano e categoria scelti): continuano ad aprirsi, sul primo asset del --nav.
    // location.replace non ferma lo script: senza il controllo, il salto all'ultimo asset sotto lo sostituirebbe.
    var FORWARD = (function () {
      var q = new URLSearchParams(location.search);
      return location.hash.indexOf('#/') === 0 || q.has('cat');
    })();
    if (FORWARD) location.replace(ASSETS[0].url + location.search + location.hash);
    else try {
      var theme = localStorage.getItem('qa:theme'); if (theme) document.documentElement.dataset.theme = theme;
      var last = localStorage.getItem('qa:asset'), q0 = new URLSearchParams(location.search);
      var hit = ASSETS.filter(function (a) { return a.label === last; })[0];
      if (hit && !q0.has('scegli')) location.replace(hit.url + (q0.get('plan') ? '?plan=' + encodeURIComponent(q0.get('plan')) : ''));
    } catch (e) { /* storage non disponibile: si mostra la scelta */ }
  </script>
  <style>
    /* Senza asset non hanno senso: visibili, spenti. */
    .picker-btn:disabled { opacity: .5; cursor: not-allowed; }
    .picker-btn:disabled:hover { border-color: var(--border); }
    .period-btn:disabled { opacity: .5; cursor: not-allowed; }
    .period-btn:disabled:hover { background: none; color: var(--muted); }
    .verdict.info { background: var(--info-soft); color: var(--info-text); }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="?scegli">
      <img class="brand-logo" src="logo.png" width="30" height="30" alt="" />
      <span class="brand-text"><span class="brand-title">Test Report</span></span>
    </a>
    <label class="run-picker plan-picker" hidden><span class="sr-only">Piano di rilascio</span><select id="plan-picker" aria-label="Piano di rilascio"></select></label>
    <nav class="suitenav" id="catnav" aria-label="Categoria">
      <span class="disabled" aria-disabled="true" title="Scegli prima un asset">Validazione</span>
      <span class="disabled" aria-disabled="true" title="Scegli prima un asset">Non regressione</span>
      <span class="disabled" aria-disabled="true" title="Scegli prima un asset">Integrazione</span>
    </nav>
    <nav class="suitenav" id="suitenav" aria-label="Asset"></nav>
    <nav class="suitenav" id="platnav" aria-label="Piattaforma" hidden></nav>
    <nav class="suitenav topnav" id="topnav" aria-label="Sezioni">
      <span class="disabled" aria-disabled="true" title="Scegli prima un asset">Panoramica</span>
      <span class="disabled" aria-disabled="true" title="Scegli prima un asset">Versioni</span>
      <span class="disabled" aria-disabled="true" title="Scegli prima un asset">Test</span>
    </nav>
    <div class="topbar-right">
      <label class="run-picker"><span class="sr-only">Esecuzione</span><button type="button" class="picker-btn" disabled title="Scegli prima un asset">Nessun asset scelto</button></label>
      <button type="button" class="icon-btn" id="theme-btn" title="Tema chiaro/scuro" aria-label="Tema chiaro/scuro">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="app">
    <div class="page-head"><div><h1 class="page-title">Panoramica</h1>
      <div class="page-sub">Nessun asset scelto</div></div>
      <div class="period" role="group" aria-label="Periodo">
        <button type="button" class="period-btn active" disabled>Ultimo sprint</button>
        <button type="button" class="period-btn" disabled>Ultimo mese</button>
        <button type="button" class="period-btn" disabled>Ultimo anno</button>
        <button type="button" class="period-btn" disabled>Massimo</button>
      </div>
    </div>
    <div class="stack">
      <section class="card verdict info">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
        <span id="notice">Seleziona un asset dalla barra in alto per vederne i report</span>
      </section>
    </div>
  </main>

  <script>
    (function () {
      var TITLE = "esse4 \u00B7 report dei test";
      var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
      var planName = function (p) { return p.title || (/^\d/.test(p.id) ? 'Piano ' + p.id : p.id); };
      var release = function (p) { var n = planName(p); return /^rilascio\b/i.test(n) ? n : 'Rilascio ' + n; };

      document.title = TITLE;

      // Barra su una riga o su due secondo il contenuto, come nei report (plans.js, fitTopbar).
      var fitTopbar = function () {
        var html = document.documentElement, bar = document.querySelector('.topbar');
        html.classList.remove('bar-wrap');
        var plan = bar.querySelector('.plan-picker:not([hidden])');
        var tight = bar.scrollWidth > bar.clientWidth + 1 || (plan && plan.getBoundingClientRect().width < 160);
        html.classList.toggle('bar-wrap', !!tight);
      };
      var fitFrame = 0;
      var fitSoon = function () { cancelAnimationFrame(fitFrame); fitFrame = requestAnimationFrame(fitTopbar); };
      window.addEventListener('resize', fitSoon);
      new MutationObserver(fitSoon).observe(document.querySelector('.topbar'), { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['hidden'] });
      fitSoon();
      document.getElementById('theme-btn').onclick = function () {
        var root = document.documentElement;
        var dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.theme = dark ? 'light' : 'dark';
        try { localStorage.setItem('qa:theme', root.dataset.theme); } catch (e) { /* storage non disponibile */ }
      };

      // I dati di ogni asset sono il suo data/index.js, caricati uno alla volta come script: vale anche
      // con il sito aperto da file.
      var load = function (a) {
        return new Promise(function (done) {
          window.QA = {};
          var s = document.createElement('script');
          s.src = a.url + 'data/index.js';
          s.onload = function () { a.data = window.QA.plans; done(); };
          s.onerror = function () { a.data = null; done(); };
          document.head.appendChild(s);
        });
      };

      ASSETS.reduce(function (p, a) { return p.then(function () { return load(a); }); }, Promise.resolve()).then(function () {
        // Piani: l'unione di quelli degli asset, il più recente per primo.
        var plans = {};
        ASSETS.forEach(function (a) {
          (a.data && a.data.plans || []).forEach(function (p) {
            var cur = plans[p.slug] || (plans[p.slug] = { slug: p.slug, id: p.id, title: p.title, last: '' });
            if (p.runs && p.last > cur.last) cur.last = p.last;
          });
        });
        var list = Object.keys(plans).map(function (k) { return plans[k]; }).sort(function (a, b) { return a.last < b.last ? 1 : -1; });
        var assets = document.getElementById('suitenav');
        if (list.length === 0) {
          document.getElementById('notice').textContent = 'Nessun report pubblicato per questi asset';
          assets.innerHTML = ASSETS.map(function (a) { return '<span class="disabled" aria-disabled="true">' + esc(a.label) + '</span>'; }).join('');
          return;
        }
        var q = new URLSearchParams(location.search);
        var chosen = plans[q.get('plan')] || list[0];
        document.querySelector('.brand').title = TITLE + ' · ' + release(chosen);

        // Piattaforme degli asset (es. Android e iOS della Consumer App): spente finché non si sceglie un asset.
        var names = [];
        ASSETS.forEach(function (a) { (a.data && a.data.platforms || []).forEach(function (p) { if (names.indexOf(p.label) < 0) names.push(p.label); }); });
        if (names.length) {
          var platNav = document.getElementById('platnav');
          platNav.innerHTML = names.sort().map(function (n) { return '<span class="disabled" aria-disabled="true" title="Scegli prima un asset">' + esc(n) + '</span>'; }).join('');
          platNav.hidden = false;
        }
        document.getElementById('notice').textContent = 'Seleziona un asset dalla barra in alto per vedere i report del ' + release(chosen);

        // Selettore del piano: stesso aspetto e stesso menu della barra dei report.
        var wrap = document.querySelector('.plan-picker'), sel = document.getElementById('plan-picker');
        sel.innerHTML = list.map(function (p) { return '<option value="' + esc(p.slug) + '"' + (p === chosen ? ' selected' : '') + '>' + esc(planName(p)) + '</option>'; }).join('');
        var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'picker-btn'; btn.textContent = planName(chosen);
        btn.setAttribute('aria-haspopup', 'listbox'); btn.setAttribute('aria-label', 'Piano di rilascio');
        var menu = document.createElement('div'); menu.className = 'picker-menu'; menu.hidden = true;
        menu.innerHTML = '<div class="picker-list" role="listbox">' + list.map(function (p) {
          return '<button type="button" role="option" class="picker-opt' + (p === chosen ? ' is-selected' : '') + '" data-slug="' + esc(p.slug) + '">' + esc(planName(p)) + '</button>';
        }).join('') + '</div>';
        wrap.append(btn, menu);
        wrap.hidden = false;
        btn.onclick = function () { menu.hidden = !menu.hidden; };
        menu.onclick = function (e) { var o = e.target.closest('.picker-opt'); if (o) location.search = '?plan=' + encodeURIComponent(o.dataset.slug) + '&scegli'; };
        document.addEventListener('click', function (e) { if (!wrap.contains(e.target)) menu.hidden = true; });

        // Asset: nessuno attivo; spento se nel piano non ha esecuzioni, come nei report.
        var has = function (a) { return a.data && (a.data.plans || []).some(function (p) { return p.slug === chosen.slug && p.runs; }); };
        assets.innerHTML = ASSETS.map(function (a) {
          return has(a) ? '<a href="' + esc(a.url) + '?plan=' + encodeURIComponent(chosen.slug) + '">' + esc(a.label) + '</a>'
            : '<span class="disabled" aria-disabled="true" title="Nessuna esecuzione di ' + esc(a.label) + ' per questo piano">' + esc(a.label) + '</span>';
        }).join('');
      });
    })();
  </script>
</body>
</html>
